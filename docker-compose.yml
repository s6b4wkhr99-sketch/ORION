# Ceragem CIOS — Docker Compose MVP (Volume 13 Section 6–7)
# Usage: docker compose --env-file deploy/env/development.env up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cios_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cios}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cios}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cios:cios_dev_password@postgres:5432/cios}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      EXPORT_PATH: ${EXPORT_PATH:-uploads}
      BACKUP_PATH: ${BACKUP_PATH:-backups}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-true}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1:8080}
      RUN_MIGRATIONS: "true"
      UPLOAD_ASYNC: ${UPLOAD_ASYNC:-true}
      BULK_UPLOAD_MODE: ${BULK_UPLOAD_MODE:-true}
      BULK_UPLOAD_ROW_THRESHOLD: ${BULK_UPLOAD_ROW_THRESHOLD:-100000}
      CUSTOMER_ANALYSIS_ONLY: ${CUSTOMER_ANALYSIS_ONLY:-true}
    volumes:
      - upload_data:/app/uploads
      - backup_data:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker.main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cios:cios_dev_password@postgres:5432/cios}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      UPLOAD_ASYNC: ${UPLOAD_ASYNC:-true}
      BULK_UPLOAD_MODE: ${BULK_UPLOAD_MODE:-true}
      BULK_UPLOAD_ROW_THRESHOLD: ${BULK_UPLOAD_ROW_THRESHOLD:-100000}
      BULK_UPLOAD_SKIP_RAW_ROWS: ${BULK_UPLOAD_SKIP_RAW_ROWS:-true}
      BULK_UPLOAD_SKIP_FULL_TRACE: ${BULK_UPLOAD_SKIP_FULL_TRACE:-true}
      BULK_UPLOAD_SKIP_VERSION_HISTORY: ${BULK_UPLOAD_SKIP_VERSION_HISTORY:-true}
      CUSTOMER_ANALYSIS_ONLY: ${CUSTOMER_ANALYSIS_ONLY:-true}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.scheduler.main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cios:cios_dev_password@postgres:5432/cios}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKUP_SCRIPT: /app/scripts/backup.sh
    volumes:
      - backup_data:/app/backups
      - upload_data:/app/uploads
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 3002
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  upload_data:
  backup_data:
