name: CIOS CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend smoke tests (auth, RBAC, upload cancel)
        run: bash scripts/run_test_smoke.sh

  postgres-acceptance:
    runs-on: ubuntu-latest
    needs: smoke
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cios
          POSTGRES_PASSWORD: cios_ci_password
          POSTGRES_DB: cios
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://cios:cios_ci_password@localhost:5432/cios
      TEST_DATABASE_URL: postgresql+psycopg2://cios:cios_ci_password@localhost:5432/cios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: PostgreSQL schema + Phase 3 acceptance
        run: bash scripts/run_test_postgres.sh

  e2e:
    runs-on: ubuntu-latest
    needs: smoke
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cios
          POSTGRES_PASSWORD: cios_ci_password
          POSTGRES_DB: cios
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_DATABASE_URL: postgresql+psycopg2://cios:cios_ci_password@localhost:5432/cios
      JWT_SECRET: ci-e2e-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright E2E smoke (5 tests)
        run: bash scripts/run_ci_e2e.sh

  test:
    runs-on: ubuntu-latest
    needs: [smoke, postgres-acceptance]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit & integration tests (Volume 12 regression)
        run: python tests/run_acceptance.py

      - name: Volume 13 DevOps acceptance
        run: python tests/test_volume13_acceptance.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  staging-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging & QA compose configs
        run: |
          bash scripts/validate_compose_staging.sh deploy/env/staging.env
          bash scripts/validate_compose_staging.sh deploy/env/qa.env
      - name: Validate deploy env templates
        run: |
          bash scripts/validate_deploy_env.sh deploy/env/qa.env qa
          bash scripts/validate_deploy_env.sh deploy/env/development.env development

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, e2e, staging-config]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cios-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t cios-frontend:${{ github.sha }} ./frontend

  # Deploy QA — requires secrets, environment, and self-hosted runner
  # Enable after configuring: QA_HOST, QA_SSH_KEY, JWT_SECRET (see docs/Deploy_Prep_Quickstart.md)
  # deploy-qa:
  #   needs: docker-build
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   environment: qa
  #   runs-on: self-hosted
