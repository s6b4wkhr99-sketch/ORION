name: CIOS CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend smoke tests (auth, RBAC, upload cancel)
        run: bash scripts/run_test_smoke.sh

  test:
    runs-on: ubuntu-latest
    needs: smoke
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit & integration tests (Volume 12 regression)
        run: python tests/run_acceptance.py

      - name: Volume 13 DevOps acceptance
        run: python tests/test_volume13_acceptance.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  staging-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging & QA compose configs
        run: |
          bash scripts/validate_compose_staging.sh deploy/env/staging.env
          bash scripts/validate_compose_staging.sh deploy/env/qa.env
      - name: Validate deploy env templates
        run: |
          bash scripts/validate_deploy_env.sh deploy/env/qa.env qa
          bash scripts/validate_deploy_env.sh deploy/env/development.env development

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, staging-config]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cios-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t cios-frontend:${{ github.sha }} ./frontend

  # Deploy QA — requires secrets, environment, and self-hosted runner
  # Enable after configuring: QA_HOST, QA_SSH_KEY, JWT_SECRET (see docs/Deploy_Prep_Quickstart.md)
  # deploy-qa:
  #   needs: docker-build
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   environment: qa
  #   runs-on: self-hosted
