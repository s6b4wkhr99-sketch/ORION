name: CIOS CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit & integration tests (Volume 12 regression)
        run: python tests/run_acceptance.py

      - name: Volume 13 DevOps acceptance
        run: python tests/test_volume13_acceptance.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cios-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t cios-frontend:${{ github.sha }} ./frontend

  # Deploy QA — requires secrets and self-hosted runner in production pipeline
  # deploy-qa:
  #   needs: docker-build
  #   environment: qa
